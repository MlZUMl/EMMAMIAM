name: Build APK convertisseur
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Publier l'APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk convertisseur.apk
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest convertisseur.apk --title "Convertisseur ¥ → € (Android)" --notes "APK à installer sur Android"
